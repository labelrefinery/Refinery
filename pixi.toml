[workspace]
name = "refinery"
version = "0.1.0"
authors = ["Marius Seritan <marius@seritan.net>"]
description = "Cold-start and bootstrap auto-labeling pipelines over sitegen scenes"
preview = ["pixi-build"]
channels = [
    "https://conda.modular.com/max-nightly",
    "https://repo.prefix.dev/modular-community",
    "conda-forge",
]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
mojo = "==1.2.0"
hungarian-mojo = { git = "https://github.com/labelrefinery/Hungarian.mojo.git", rev = "ff7e457fd4bb59b14fea02b19d39d009d20ceb98" }
kalman-mojo = { git = "https://github.com/labelrefinery/Kalman.mojo.git", rev = "a2f64ab912225c2aabe744ba5e43bec071f85747" }
stone-mojo = { git = "https://github.com/labelrefinery/Stone.mojo.git", rev = "d1b5f827f5ef131e285b6f8d51bb9aef2597a7ff" }
# Operational state -- pipeline invocations, router decisions, the review queue.
# Labels stay in Iceberg; this is the control plane, which wants point lookups
# and small frequent writes rather than table commits.
libsqlite = ">=3.45,<4"
# Durable execution: the executor is a Restate service, so a stage that dies
# mid-run is retried from the journal rather than from the top.
# Pinned at the revision mojoshelf published for restate-mojo 0.4.1, the first
# release built with Mojo 1.2.0 (on threads-mojo 0.6.1).
restate-mojo = { git = "https://github.com/magmalake/restate.mojo", rev = "e391b04b0de1f0c1f5f1b5ab736d43d171e4d1f8" }
# Content hashing for the idempotency ledger. XXH64 rather than SHA-256: this
# is change detection, not a security boundary, and it keeps Refinery free of
# objectstore.mojo (libcurl + a C shim) which is where the SHA-256 lives.
# Reviewed labels become a versioned, immutable Iceberg dataset -- the record
# that a human corrected something, rather than a CSV that gets overwritten.
# Pinned at the revision mojoshelf published for iceberg-mojo 0.8.3 (what
# `pixi shelf add iceberg-mojo` writes), built with Mojo 1.2.0.
iceberg-mojo = { git = "https://github.com/magmalake/iceberg.mojo", rev = "fa79fb13de1a8e063e1fa7bc087276f5858052ee" }

[tasks]
format = { cmd = "mojo format src", description = "Format all Mojo sources" }
check = { cmd = "mojo run -I src src/main.mojo", description = "Compile-check the pipeline (prints usage)" }
test-proc = { cmd = "mojo run -I src test/test_proc.mojo", description = "Subprocess helper tests" }
test-opsdb = { cmd = "mojo run -I src test/test_opsdb.mojo", description = "Control-plane database tests" }
test-runctx = { cmd = "mojo run -I src test/test_runctx.mojo", description = "Idempotency ledger tests" }
test-filter = { cmd = "mojo run -I src test/test_filter.mojo", description = "Label filter tests" }
test-router = { cmd = "mojo run -I src test/test_router.mojo", description = "Router and stage table tests" }
test-review = { cmd = "mojo run -I src test/test_review.mojo", description = "Reviewer edit application tests" }
test-publish = { cmd = "mojo run -I src test/test_publish.mojo", description = "Iceberg publish tests" }
test-datasets = { cmd = "mojo run -I src test/test_datasets.mojo", description = "Kind tables and evaluation rows" }
test-trainconfig = { cmd = "mojo run -I src test/test_trainconfig.mojo", description = "Training config generation tests" }
test-stages = { cmd = "mojo run -I src test/test_stages.mojo", description = "Pipeline stage edge cases" }
test-av2 = { cmd = "mojo run -I src test/test_av2.mojo", description = "AV2 scoring and the drive-sized terrain grid" }
test = { depends-on = ["test-proc", "test-opsdb", "test-runctx", "test-filter", "test-router", "test-review", "test-publish", "test-datasets", "test-trainconfig", "test-stages", "test-av2"], description = "All Mojo tests" }
build-executor = { cmd = "mojo build -I src src/executor.mojo -o build/executor", description = "Build the Restate executor service" }
# Must run under `pixi run`: restate.mojo resolves librestatemojo from
# $CONDA_PREFIX/lib, and falls back to a dev-relative path when it is unset.
executor = { cmd = "./build/executor", depends-on = ["build-executor"], description = "Serve the Restate executor on :9080" }
build-orchestrator = { cmd = "mojo build -I src src/orchestrator.mojo -o build/orchestrator", description = "Build the durable loop" }
orchestrator = { cmd = "./build/orchestrator", depends-on = ["build-orchestrator"], description = "Serve the durable loop on :9081" }

# The orca environment: Pipeline A over Argoverse 2 as an orca pipeline
# (src/av2_pipeline_a.mojo). orca isn't a package; like its own `data`
# environment, it builds against sibling checkouts of the magmalake repos
# (../../magmalake/*), each at the revision deploy/deps.txt pins. It leaves
# out the default feature, whose packaged iceberg-mojo would be a second copy
# of the iceberg it builds from source. The pins below are orca's `data`
# environment's. The same environment builds orca's own binary and
# LabelControl's site (from ../LabelControl), so the deploy image
# (deploy/Dockerfile) needs only this one.
[feature.orca.dependencies]
mojo-compiler = "==1.2.0"
hungarian-mojo = { git = "https://github.com/labelrefinery/Hungarian.mojo.git", rev = "ff7e457fd4bb59b14fea02b19d39d009d20ceb98" }
kalman-mojo = { git = "https://github.com/labelrefinery/Kalman.mojo.git", rev = "a2f64ab912225c2aabe744ba5e43bec071f85747" }
stone-mojo = { git = "https://github.com/labelrefinery/Stone.mojo.git", rev = "d1b5f827f5ef131e285b6f8d51bb9aef2597a7ff" }
objectstore-mojo = { git = "https://github.com/magmalake/objectstore.mojo", rev = "748e2d31450a7793592e439d6c69d8c6598d2129" }
zstd-mojo = { git = "https://github.com/magmalake/zstd.mojo", rev = "53655623ca8585fd5b36b1239842913ec308ae69" }
lz4-mojo = { git = "https://github.com/magmalake/lz4.mojo", rev = "64502eeeabed37515cd479bc421fc2920504cac5" }
brotli-mojo = { git = "https://github.com/magmalake/brotli.mojo", rev = "aa6d14985baf82ad4b934f14136b95a291b55faf" }
sqlite-mojo = { git = "https://github.com/magmalake/sqlite.mojo", rev = "53b819cd395b1b0afe8772dfbb43489da6ce939e" }
postgres-mojo = { git = "https://github.com/magmalake/postgres.mojo", rev = "bfe9b94ae97e3e184dc6d118b0684818927a5da8" }
flare_mlake = { git = "https://github.com/magmalake/flare_mlake", rev = "0cb5005489bb1af57ca0421b8f0fcd206bbacf42" }
json_mlake = { git = "https://github.com/magmalake/json_mlake", rev = "d850b1c90487e1e9a88ac87d1c1d7f53ffba7276" }
libcurl = ">=8,<9"
libsqlite = ">=3.45,<4"
libpq = ">=16,<19"
postgresql = ">=16,<19"

[feature.orca.activation.env]
DEP_INC = "-I ../../magmalake/orca.mojo/src -I ../../magmalake/dista.mojo/src -I ../../magmalake/k8s.mojo/src -I ../../magmalake/memory-region.mojo/src -I ../../magmalake/arrow-mlake.mojo/src -I ../../magmalake/parquet.mojo/src -I ../../magmalake/parquet.mojo/full/src -I ../../magmalake/threads.mojo/src -I ../../magmalake/threads.mojo/compat -I ../../magmalake/thrift.mojo/src -I ../../magmalake/hashes.mojo/src -I ../../magmalake/snappy.mojo/src -I ../../magmalake/deflate.mojo/src -I ../../magmalake/avro.mojo/src -I ../../magmalake/roaring.mojo/src -I ../../magmalake/objectstore.mojo/src -I ../../magmalake/zstd.mojo/src -I ../../magmalake/lz4.mojo/src -I ../../magmalake/brotli.mojo/src -I ../../magmalake/sqlite.mojo -I ../../magmalake/postgres.mojo/src -I ../../magmalake/iceberg.mojo/src"
ORCA_WAREHOUSE = "runs/av2/warehouse"
AV2_ROOT = "runs/av2"

[feature.orca.tasks]
build-av2-logs = { cmd = "mkdir -p build && mojo build -I src $DEP_INC src/av2_logs.mojo -o build/av2-logs", description = "Build the av2.logs writer" }
av2-logs = { cmd = "./build/av2-logs $ORCA_WAREHOUSE configs/av2_sample.txt", depends-on = ["build-av2-logs"], description = "Write av2.logs from configs/av2_sample.txt" }
test-lake = { cmd = "mojo run -I src $DEP_INC test/test_lake.mojo", description = "Labels and evaluations written from an orca step" }
build-refinery = { cmd = "mkdir -p build && mojo build -I src $DEP_INC src/main.mojo -o build/refinery", description = "Build the sequential Pipeline A CLI" }
build-geometry-tasks = { cmd = "mkdir -p build && mojo build -I src $DEP_INC src/geometry_tasks.mojo -o build/geometry-tasks", description = "Build Pipeline A's geometry on dista" }
test-geometry-tasks = { cmd = "test/geometry_tasks.sh", depends-on = ["build-refinery", "build-geometry-tasks"], description = "The geometry stage on dista writes what the sequential one writes (pass work directories)" }
test-av2-view = { cmd = "mojo run -I src $DEP_INC test/test_av2_view.mojo", description = "The AV2 view bundle and the viewer's path checks" }
build-orca = { cmd = "mkdir -p build && mojo build $DEP_INC ../../magmalake/orca.mojo/bin/scheduler.mojo -o build/orca", description = "Build orca's scheduler and UI binary from the sibling checkout" }
build-labelcontrol = { cmd = "mkdir -p build && mojo build -I ../LabelControl/src $DEP_INC ../LabelControl/src/server.mojo -o build/labelcontrol", description = "Build LabelControl's site from the sibling checkout" }
build-av2-viewer = { cmd = "mkdir -p build && mojo build -I src $DEP_INC src/av2_viewer.mojo -o build/av2-viewer", description = "Build the AV2 slice viewer" }
av2-viewer = { cmd = "./build/av2-viewer", depends-on = ["build-av2-viewer"], description = "Serve the AV2 slice viewer on 127.0.0.1:8280" }
av2-pipeline-a = { cmd = "mkdir -p build && mojo build -I src $DEP_INC src/av2_pipeline_a.mojo -o build/av2-pipeline-a", description = "Build Pipeline A over AV2 as an orca pipeline" }

[environments]
orca = { features = ["orca"], no-default-feature = true }
