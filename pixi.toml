[workspace]
name = "refinery"
version = "0.1.0"
authors = ["Marius Seritan <marius@seritan.net>"]
description = "Cold-start and bootstrap auto-labeling pipelines over sitegen scenes"
preview = ["pixi-build"]
channels = [
    "https://conda.modular.com/max-nightly",
    "https://repo.prefix.dev/modular-community",
    "conda-forge",
]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
mojo = "==1.0.0"
hungarian-mojo = { git = "https://github.com/labelrefinery/Hungarian.mojo.git", rev = "f20267c62fcfbf65b40beaaee7e9801f341ebf93" }
kalman-mojo = { git = "https://github.com/labelrefinery/Kalman.mojo.git", rev = "76bcbfff125237108cb218d8f277eab91749c354" }
stone-mojo = { git = "https://github.com/labelrefinery/Stone.mojo.git", rev = "9a37fac97fc80313941796cf0b2cc3d824e93cf5" }
# Operational state -- pipeline invocations, router decisions, the review queue.
# Labels stay in Iceberg; this is the control plane, which wants point lookups
# and small frequent writes rather than table commits.
libsqlite = ">=3.45,<4"
# Durable execution: the executor is a Restate service, so a stage that dies
# mid-run is retried from the journal rather than from the top.
# Pinned at the merge commit of magmalake/restate.mojo#5 (0.3.2: served mode on
# threads-mojo 0.4.0's TypedPool). Move to the mojoshelf-published revision once
# restate-mojo 0.3.2 is on the shelf.
restate-mojo = { git = "https://github.com/magmalake/restate.mojo", rev = "e01fda13dbe4d4cf00988a578f5713d70045dd6a" }
# Content hashing for the idempotency ledger. XXH64 rather than SHA-256: this
# is change detection, not a security boundary, and it keeps Refinery free of
# objectstore.mojo (libcurl + a C shim) which is where the SHA-256 lives.
# Reviewed labels become a versioned, immutable Iceberg dataset -- the record
# that a human corrected something, rather than a CSV that gets overwritten.
# Pinned at the revision mojoshelf published for iceberg-mojo 0.6.1 (what
# `pixi shelf add iceberg-mojo` writes). 0.6.1 is the first release whose own
# package pins name threads-mojo 0.4.0; earlier releases pulled threads 0.1.0
# in transitively, and its deprecation warnings with it.
iceberg-mojo = { git = "https://github.com/magmalake/iceberg.mojo", rev = "3c4cda63ec4983f266cf0b802fa30734d8ab6a04" }

[tasks]
format = { cmd = "mojo format src", description = "Format all Mojo sources" }
check = { cmd = "mojo run -I src src/main.mojo", description = "Compile-check the pipeline (prints usage)" }
test-proc = { cmd = "mojo run -I src test/test_proc.mojo", description = "Subprocess helper tests" }
test-opsdb = { cmd = "mojo run -I src test/test_opsdb.mojo", description = "Control-plane database tests" }
test-runctx = { cmd = "mojo run -I src test/test_runctx.mojo", description = "Idempotency ledger tests" }
test-filter = { cmd = "mojo run -I src test/test_filter.mojo", description = "Label filter tests" }
test-router = { cmd = "mojo run -I src test/test_router.mojo", description = "Router and stage table tests" }
test-review = { cmd = "mojo run -I src test/test_review.mojo", description = "Reviewer edit application tests" }
test-publish = { cmd = "mojo run -I src test/test_publish.mojo", description = "Iceberg publish tests" }
test-datasets = { cmd = "mojo run -I src test/test_datasets.mojo", description = "Dataset registry tests" }
test-trainconfig = { cmd = "mojo run -I src test/test_trainconfig.mojo", description = "Training config generation tests" }
test-stages = { cmd = "mojo run -I src test/test_stages.mojo", description = "Pipeline stage edge cases" }
test = { depends-on = ["test-proc", "test-opsdb", "test-runctx", "test-filter", "test-router", "test-review", "test-publish", "test-datasets", "test-trainconfig", "test-stages"], description = "All Mojo tests" }
build-executor = { cmd = "mojo build -I src src/executor.mojo -o build/executor", description = "Build the Restate executor service" }
# Must run under `pixi run`: restate.mojo resolves librestatemojo from
# $CONDA_PREFIX/lib, and falls back to a dev-relative path when it is unset.
executor = { cmd = "./build/executor", depends-on = ["build-executor"], description = "Serve the Restate executor on :9080" }
build-orchestrator = { cmd = "mojo build -I src src/orchestrator.mojo -o build/orchestrator", description = "Build the durable loop" }
orchestrator = { cmd = "./build/orchestrator", depends-on = ["build-orchestrator"], description = "Serve the durable loop on :9081" }
